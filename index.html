<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>myLucky · Lotofácil com cobertura garantida</title>
    <meta
      name="description"
      content="Gera 14 dezenas com o perfil estatístico dos sorteios reais e as desdobra em 11 jogos com garantia matemática de pontos, conferidos contra todos os concursos da Lotofácil."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        const stored = localStorage.getItem("theme");
        const theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.classList.add(theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
